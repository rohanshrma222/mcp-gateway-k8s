# Server config for the dashboard, dropped into /etc/nginx/conf.d/.
#
# The base nginx.conf from nginxinc/nginx-unprivileged is left alone - it already writes
# its pid to /tmp and runs as uid 101, which is what makes a read-only root filesystem
# possible. Replacing the whole file would mean re-deriving those choices.

server {
    # 8080, not 80. A container listening below 1024 needs CAP_NET_BIND_SERVICE, and the
    # chart drops every capability - so a privileged port would mean either adding a
    # capability back or running as root, to serve static files.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version. It is not a defence on its own, but it is free and it
    # removes a line from the reconnaissance an attacker gets for nothing.
    server_tokens off;

    # Probe target that does not depend on the application bundle.
    #
    # Pointing readiness at `/` would make it depend on index.html being present and
    # correct, so a broken build could still report ready - or, worse, a correct build
    # could report unready because of an unrelated asset. This answers from nginx itself.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable by construction: the filename changes when the content
    # does, which is what makes a long cache safe. Vite emits them under /assets.
    location /assets/ {
        # ONE Cache-Control header, with max-age inside it.
        #
        # This was `expires 1y;` plus `add_header Cache-Control "public, immutable";`, and
        # serving real assets for the first time showed what that produces: TWO
        # Cache-Control headers on every asset response, because `expires` emits its own.
        # The HTTP spec says a recipient should treat repeated headers as a comma-joined
        # list, so most clients do the right thing - but "most clients" is not a cache
        # policy, and some intermediaries take the first and discard the rest, which would
        # drop `immutable` silently.
        #
        # Dropping `expires` also drops the legacy `Expires` header. That is fine and
        # deliberate: it is HTTP/1.0, and Cache-Control takes precedence wherever both are
        # understood.
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: unknown paths return index.html so client-side routing works on a
        # refresh or a shared link. Without it, /audit would be a 404 from nginx even
        # though the application knows that route.
        try_files $uri $uri/ /index.html;

        # index.html itself must NOT be cached, or a deploy leaves browsers holding an old
        # document that references asset filenames which no longer exist - a blank page
        # that a refresh does not fix.
        add_header Cache-Control "no-store, must-revalidate";

        # Headers applied here rather than at the server level, because add_header in a
        # location block replaces the inherited set rather than adding to it - a detail
        # that silently drops headers if they are split across both.
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        # The session cookie is httpOnly and SameSite=Strict, so the main residual risk is
        # script injection. This CSP is the other half of that defence: scripts only from
        # our own origin, no inline script, and nothing may frame us.
        #
        # style-src allows 'unsafe-inline' because React sets element styles directly;
        # that is a real concession and it is narrow - it permits inline CSS, not inline
        # JavaScript. connect-src 'self' is what keeps the dashboard talking only to this
        # origin's /api, which is also why the Ingress puts both on one host.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
