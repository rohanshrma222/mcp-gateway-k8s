# charts/platform - k3s VPS.

global:
  storageClass: local-path
  imageRegistry: ghcr.io/rohanshrma222
  imagePullPolicy: Always

platform:
  host: app.example.com

postgres:
  image:
    digest: ''  # pinned at release time
  persistence:
    size: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '2', memory: 2Gi }

gateway:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: '2', memory: 768Mi }
  rateLimit:
    enabled: true
    requestsPerMinute: 60

dashboard:
  replicas: 2

ingress:
  className: traefik
  tls:
    enabled: true
    secretName: platform-tls
    clusterIssuer: letsencrypt-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

secrets:
  # In production the secrets are created out of band and named here, so no credential is
  # ever generated by, or recoverable from, a Helm release. The local default of
  # generate-and-keep is a development convenience and says so.
  #
  # The strategy was documented here before 9.5 and was not EXECUTABLE: it named four
  # Secrets and gave no way to create them, which is the kind of documentation that reads as
  # complete and leaves whoever deploys it guessing at key names. The commands:
  #
  #   kubectl create namespace urumi-platform
  #
  #   # 48 characters, matching what the chart generates locally. The config schema requires
  #   # at least 32. Rotating this logs everyone out and does nothing worse.
  #   kubectl -n urumi-platform create secret generic urumi-jwt \\
  #     --from-literal=jwt-secret="$(openssl rand -base64 36 | tr -d =)"
  #
  #   # AES-256-GCM. ROTATING THIS DESTROYS every stored upstream credential, because they
  #   # are encrypted under it and the PVC outlives the release - see gateway-secret.yaml for
  #   # why that Secret carries resource-policy: keep. Back this up outside the cluster.
  #   kubectl -n urumi-platform create secret generic urumi-encryption \\
  #     --from-literal=encryption-key="$(openssl rand -base64 24 | tr -d =)"
  #
  #   # The model API key, from console.groq.com. Omit this Secret entirely to run without the
  #   # chat agent: GROQ_API_KEY is the only optional secret in the gateway config, so
  #   # POST /api/chat answers 503 and everything else works.
  #   kubectl -n urumi-platform create secret generic urumi-groq \\
  #     --from-literal=groq-api-key=gsk_...
  #
  #   # The first admin and member. The seed Job is idempotent, so changing a password here
  #   # does NOT rotate an existing account - change it in the dashboard instead.
  #   kubectl -n urumi-platform create secret generic urumi-bootstrap \\
  #     --from-literal=admin-email=admin@example.com \\
  #     --from-literal=admin-password="$(openssl rand -base64 18)" \\
  #     --from-literal=member-email=member@example.com \\
  #     --from-literal=member-password="$(openssl rand -base64 18)"
  #
  # The key NAMES inside each Secret are not arbitrary - the chart reads exactly these, and a
  # Secret with the right name and a wrong key gives a pod stuck in
  # CreateContainerConfigError rather than a readable error.
  jwtExistingSecret: urumi-jwt
  encryptionExistingSecret: urumi-encryption
  groqExistingSecret: urumi-groq
  bootstrapExistingSecret: urumi-bootstrap
