# charts/platform - the control plane. Defaults shared by every environment.
#
# Same rule as the other charts: anything true everywhere lives here, and the overlays
# carry only genuine environment differences.

nameOverride: ''
fullnameOverride: ''

global:
  imageRegistry: ''
  imagePullPolicy: IfNotPresent
  storageClass: ''

platform:
  host: app.urumi.local

# -------------------------------------------------------------------- postgres

postgres:
  image:
    repository: postgres
    tag: '18.2-alpine'
  auth:
    database: urumi
    username: urumi
    existingSecret: ''
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ''
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 1Gi }
  probes:
    # `pg_isready` reports whether the server will accept a connection. A TCP check would
    # succeed during recovery, when it will not.
    readiness:
      exec: { command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
      periodSeconds: 10
    liveness:
      exec: { command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
      periodSeconds: 30
      failureThreshold: 6
    startup:
      exec: { command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
      periodSeconds: 5
      failureThreshold: 60
  securityContext:
    # readOnlyRootFilesystem stays at the hardened default of true. Postgres does need to
    # write outside its data directory - a unix socket and a lock file - but the template
    # gives it emptyDir volumes for exactly those two paths, which names what is writable
    # instead of opening the whole filesystem. uid/gid 70 is `postgres` in the Alpine
    # image; fsGroup is what lets a non-root process write to the mounted PVC.
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  ports:
    - name: postgres
      containerPort: 5432

# ------------------------------------------------------------------ migrations

migrations:
  enabled: true
  # The same image as the server, so psql is guaranteed to be the matching major version.
  # A separate client image would be smaller and would introduce a version skew nobody
  # thinks about until a newer server speaks a protocol the older client does not.
  image:
    repository: postgres
    tag: '18.2-alpine'
  # Three attempts. A migration that fails for a transient reason (the database finished
  # starting a second later) deserves a retry; one that fails because the SQL is wrong
  # will fail identically three times and then stop, which is the right outcome - an
  # unbounded backoffLimit would retry a syntax error until the hook times out.
  backoffLimit: 3
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 192Mi }
  securityContext:
    runAsUser: 70
    runAsGroup: 70

# --------------------------------------------------------------------- gateway

gateway:
  image:
    repository: urumi/gateway
    tag: dev
  # Two replicas by default, not as a scaling flourish but to keep the design honest:
  # the /mcp endpoint is a stateless Streamable HTTP server with no session store, and
  # running two replicas everywhere means any accidental in-memory session state fails
  # immediately rather than in production.
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: '1', memory: 512Mi }
  probes:
    # /readyz checks Postgres; /healthz checks only the process. Upstream MCP servers are
    # deliberately excluded from both - a dead upstream must degrade one server's tools,
    # not remove the whole gateway from its Service and take the dashboard down with it.
    readiness:
      httpGet: { path: /readyz, port: http }
      periodSeconds: 10
    liveness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 30
      failureThreshold: 6
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  ports:
    - name: http
      containerPort: 3000
  # Keep at least one replica serving during a node drain or a rolling upgrade.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  logLevel: info
  # Whether the session cookie carries the Secure attribute. True here so the safe value
  # is the default; values-local.yaml turns it off because the kind cluster serves plain
  # HTTP, where a Secure cookie is never stored at all - login would appear to succeed and
  # every later request would 401.
  cookieSecure: true
  # Pool size PER REPLICA, and the arithmetic matters: this is multiplied by the replica
  # count, and exceeding Postgres's max_connections (default 100) turns a traffic spike
  # into "too many clients already" for every replica at once. 10 x 2 leaves ample
  # headroom for the migration Job and an administrator's psql session.
  poolMax: 10
  upstreamProbeIntervalSeconds: 15
  # Per-probe timeout, deliberately far below upstreamTimeoutSeconds. A probe is a liveness
  # question: 3s says "answer promptly or you are not healthy". Using the 20s tool-call
  # budget would let one slow upstream consume more than a whole probe interval by itself,
  # so cycles would overlap and the prober would spend its life waiting on the least
  # healthy thing it monitors.
  upstreamProbeTimeoutMs: 3000
  upstreamTimeoutSeconds: 20
  rateLimit:
    enabled: true
    requestsPerMinute: 120
  # Hosts the gateway is permitted to register as upstreams. The SSRF guard resolves a
  # candidate URL's addresses and rejects loopback, private, link-local and CGNAT space;
  # this allowlist is what re-admits the in-cluster services that are legitimately on
  # private addresses.
  # MANDATORY and default-deny: a host matching nothing here cannot be registered,
  # however public and harmless its addresses are. The first version of the SSRF guard
  # treated this as an exemption and allowed any public host by default, which made the
  # gateway a general-purpose outbound fetcher the moment someone registered an upstream.
  # Adding a genuinely external upstream is therefore a deliberate, reviewable act: edit
  # this list and redeploy, rather than typing a URL into a form.
  upstreamAllowlist:
    - '*.svc.cluster.local'
  # The subset additionally permitted to resolve into PRIVATE address space. Separate from
  # the list above because the questions differ: "may this be registered" is about the
  # operator's intent, while "may this live on a private address" is about whether private
  # space is where it legitimately lives - true for in-cluster Services, false for a
  # vendor's hosted server, where resolving privately would be a sign something is wrong.
  #
  # Note what is NOT exempted even here: loopback, link-local (cloud metadata), multicast
  # and the reserved ranges are refused for every host. A caller who can create an
  # ExternalName Service in a namespace they control could otherwise point an allowlisted
  # cluster name at 169.254.169.254.
  upstreamPrivateHosts:
    - '*.svc.cluster.local'

# ------------------------------------------------------------------------ seed

seed:
  enabled: true
  # The gateway image, run as `node dist/seed.js`. The same image on purpose: the password
  # hash must be produced by exactly the argon2id code and parameters that the login route
  # verifies it against, and two implementations of one format drift.
  image:
    repository: urumi/gateway
    tag: dev
  adminEmail: admin@urumi.local
  memberEmail: member@urumi.local
  # Upstreams registered on first install, so a fresh cluster has the WooCommerce MCP
  # server already wired in - the brief asks for it pre-registered rather than as a manual
  # step after deploying.
  #
  # ON CONFLICT (slug) DO NOTHING, so this is a STARTING POINT and not an authority: an
  # admin who later edits the URL, disables the server or attaches a credential keeps those
  # changes across every `helm upgrade`.
  #
  # A list rather than one hardcoded entry because stage 6 adds notes-mcp and
  # everything-mcp, which belong here for the same reason - an upstream the charts install
  # should be registered by the charts.
  #
  # Every host here must also match gateway.upstreamAllowlist, or the seed Job refuses:
  # registering a URL the SSRF guard will reject on every call would produce an upstream
  # that is permanently unreachable for a reason nobody would look for in a values file.
  #
  # authType is 'none' only. An upstream needing a credential is registered through the API,
  # where the write-only encrypted path already exists - putting a secret in this list would
  # mean it travelling through the seed Job's environment to get there.
  upstreams:
    - name: WooCommerce (default store)
      slug: woo
      url: http://store-default-woo-mcp.store-default.svc.cluster.local:3000/mcp
      authType: none
      timeoutMs: 20000
    # Step 6.3. This entry is the whole cost of adding an upstream the charts install -
    # no gateway code changed, which is what the list in 5.5 was for.
    #
    # It exposes list_products, exactly as the WooCommerce server does. That collision is
    # deliberate: the gateway advertises them as notes__list_products and
    # woo__list_products, and they return genuinely different answers - what the team has
    # written about versus what is actually in the shop.
    - name: Team notes
      slug: notes
      url: http://upstreams-notes-mcp.mcp-upstreams.svc.cluster.local:3000/mcp
      authType: none
      timeoutMs: 10000
  backoffLimit: 3
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    # 256Mi, not less: argon2id is configured for 19 MiB per hash and the Node runtime
    # needs room around it. Two hashes run here, sequentially, so this is comfortable.
    limits: { cpu: 500m, memory: 256Mi }
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

# ------------------------------------------------------------------- dashboard

dashboard:
  image:
    # Static React build served by nginx-unprivileged, so the web tier runs as a normal
    # user with a read-only root filesystem.
    repository: urumi/dashboard
    tag: dev
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 250m, memory: 128Mi }
  probes:
    # /healthz is answered by nginx itself, not by a file on disk. Pointing these at `/`
    # would make readiness depend on index.html being present and correct - so a broken
    # build could still report ready, and an unrelated missing asset could report unready.
    readiness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 10
      timeoutSeconds: 2
    liveness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 30
      failureThreshold: 6
      timeoutSeconds: 2
  securityContext:
    # nginx-unprivileged is uid/gid 101 and listens on 8080, so the pod needs no
    # capabilities at all - and the root filesystem stays read-only because the two paths
    # nginx writes to get emptyDir volumes. See dashboard-deployment.yaml.
    runAsUser: 101
    runAsGroup: 101
  ports:
    - name: http
      containerPort: 8080

# --------------------------------------------------------------------- ingress

ingress:
  enabled: true
  className: traefik
  annotations: {}
  tls:
    enabled: false
    secretName: ''
    clusterIssuer: ''
  # Order matters: the two API prefixes must be matched before the dashboard's catch-all,
  # or every /api call would be answered with the React index.html.
  paths:
    - path: /api
      service: gateway
      port: http
    - path: /mcp
      service: gateway
      port: http
    - path: /
      service: dashboard
      port: http

# ---------------------------------------------------------------------- secrets

secrets:
  # Names of the Kubernetes Secrets this chart reads. Nothing in this repo contains a
  # credential value; these are references.
  #
  # - jwt:        signing key for the dashboard session cookie
  # - encryption: AES-256-GCM key that wraps upstream credentials at rest
  # - groq:       LLM API key for the chat agent, server-side only
  # - bootstrap:  the seeded admin and member passwords
  #
  # Empty means "generate on first install and keep it": the template uses `lookup` to
  # reuse the existing Secret on upgrade, so rotating is an explicit act rather than a
  # side effect of `helm upgrade`.
  jwtExistingSecret: ''
  encryptionExistingSecret: ''
  groqExistingSecret: ''
  bootstrapExistingSecret: ''

# ---------------------------------------------------------------- networkpolicy

networkPolicy:
  enabled: true
  # The ingress controller, selected by namespace AND pod label, so the gateway's HTTP
  # port is reachable from Traefik and from nothing else.
  ingressNamespace: traefik
  ingressPodLabels:
    app.kubernetes.io/name: traefik
  # Namespaces holding upstream MCP servers the gateway is allowed to dial. Listed
  # explicitly rather than allowing all egress: the gateway holds every upstream
  # credential and every user's API key, so it is the pod whose outbound reach matters
  # most. `mcp-upstreams` is listed before it exists, because an egress rule naming a
  # namespace that has not been created yet is simply inert - whereas discovering the
  # omission in stage 6 would present as an upstream that is unreachable for no visible
  # reason.
  upstreamNamespaces:
    - store-default
    - mcp-upstreams

metrics:
  # prom-client /metrics on the gateway. No Ingress path: metrics are scraped in-cluster,
  # and exposing them publicly would leak tool names, user counts and failure rates.
  enabled: true
