# charts/platform - local kind cluster.

global:
  storageClass: standard
  imagePullPolicy: IfNotPresent

platform:
  host: app.urumi.local

postgres:
  persistence:
    size: 2Gi

gateway:
  # Three nodes here, two of them schedulable, so a hard spread constraint is satisfiable -
  # and requiring it is the only way the "two replicas survive a node failure" claim is
  # actually true. 9.3 measured BOTH pods on urumi-worker2 under the default soft preference,
  # which the scheduler is free to ignore and did.
  topologySpreadStrictness: DoNotSchedule
  # Still 2 locally. The point of the replica count is to prove the /mcp endpoint is
  # genuinely stateless, and proving that on a laptop is the whole reason the kind
  # cluster has two worker nodes.
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  # Plain HTTP locally, so a Secure cookie would never be stored by the browser: login
  # would appear to succeed and every subsequent request would 401. This is exactly the
  # kind of genuine environment difference the overlays exist for - and it is the one
  # setting in this file that is a security relaxation rather than a sizing change, which
  # is why it is spelled out rather than left implicit.
  cookieSecure: false

ingress:
  tls:
    enabled: false

# The chat agent (stage 8), pointed at a Secret created by hand in the cluster:
#
#   kubectl create secret generic urumi-groq -n urumi-platform #     --from-literal=groq-api-key=gsk_...
#
# Here rather than passed as --set on every deploy, which is how it was being done until 9.5
# noticed. The prod-parity check compares the local and prod renders field by field, and the
# difference it reported was not a bug in either overlay - it was that LOCAL DID NOT ENABLE A
# FEATURE PROD DID, so three objects differed in shape for no reason anybody intended. A
# --set that has to be remembered is not configuration, it is a step.
#
# An external Secret rather than secrets.groqApiKey, so the key never enters a values file,
# and the same mechanism prod uses - which is the point of having it agree.
secrets:
  groqExistingSecret: urumi-groq
