# charts/platform - local kind cluster.

global:
  storageClass: standard
  imagePullPolicy: IfNotPresent

platform:
  host: app.urumi.local

postgres:
  persistence:
    size: 2Gi

gateway:
  # Still 2 locally. The point of the replica count is to prove the /mcp endpoint is
  # genuinely stateless, and proving that on a laptop is the whole reason the kind
  # cluster has two worker nodes.
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  # Plain HTTP locally, so a Secure cookie would never be stored by the browser: login
  # would appear to succeed and every subsequent request would 401. This is exactly the
  # kind of genuine environment difference the overlays exist for - and it is the one
  # setting in this file that is a security relaxation rather than a sizing change, which
  # is why it is spelled out rather than left implicit.
  cookieSecure: false

ingress:
  tls:
    enabled: false
