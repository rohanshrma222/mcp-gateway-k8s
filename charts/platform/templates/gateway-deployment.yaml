{{- $ctx := dict "root" $ "component" "gateway" "spec" .Values.gateway }}
{{/*
Step 4.2 - the gateway, as a skeleton: config, logging, and the three operational
endpoints. Identity, the registry and the MCP endpoint land in 4.3 through 5.4.

A Deployment, not a StatefulSet, and that is the whole architectural claim of this
project in one line: the gateway holds no state of its own. Everything durable is in
Postgres, so a replica is interchangeable, any replica can answer any request, and
scaling is a number. If this ever needed to be a StatefulSet, something would have gone
wrong in the design rather than in the chart.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.gateway.name" . }}
  labels:
    {{- include "common.componentLabels" $ctx | nindent 4 }}
spec:
  # Two by default in every environment, including a laptop. Not a scaling flourish: the
  # /mcp endpoint is a stateless Streamable HTTP server with no session store, and running
  # two replicas everywhere means accidental in-memory state fails during development
  # rather than in production.
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the configured count during a rollout, and at most one extra
      # pod at a time. With two replicas that keeps both serving while the new one proves
      # itself, which is what makes the upgrade/rollback demo in 9.6 a non-event.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" $ctx | nindent 8 }}
      annotations:
        # Unlike the database StatefulSets, this one DOES want a checksum annotation.
        #
        # The gateway reads JWT_SECRET and ENCRYPTION_KEY as environment variables, and an
        # env var is fixed for the life of a process - so a rotated Secret would be
        # ignored until something happened to restart the pod, which could be weeks. The
        # checksum makes `helm upgrade` roll the Deployment when either value changes.
        #
        # The reason this is safe here and not for Postgres: rolling a stateless replica
        # costs nothing, while rolling a database during a dry-run render where `lookup`
        # returns a fresh random value would be an unnecessary database restart.
        checksum/secrets: {{ printf "%s/%s" (include "platform.gateway.jwtSecretName" .) (include "platform.gateway.encryptionSecretName" .) | sha256sum }}
    spec:
      {{- include "common.automountServiceAccountToken" $ctx | nindent 6 }}
      {{- include "common.podSecurityContext" $ctx | nindent 6 }}
      # Spread replicas across nodes where possible. ScheduleAnyway rather than
      # DoNotSchedule: on a single-node cluster a hard constraint would leave the second
      # replica Pending forever, and the point is availability, not a rule for its own
      # sake.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "common.selectorLabels" $ctx | nindent 14 }}
      containers:
        - name: gateway
          {{- include "common.containerDefaults" $ctx | nindent 10 }}
          {{- include "common.containerPorts" $ctx | nindent 10 }}
          env:
            - name: PORT
              value: {{ (first .Values.gateway.ports).containerPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}

            # Postgres, assembled from parts. The password arrives from its own Secret,
            # which is why this is five variables rather than one connection string: a
            # DSN built in the template would put the credential into the rendered
            # manifest and then into `kubectl describe pod`.
            - name: PGHOST
              value: {{ include "platform.postgres.name" . | quote }}
            - name: PGPORT
              value: {{ (first .Values.postgres.ports).containerPort | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.auth.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.postgres.secretName" . }}
                  key: postgres-password
            - name: PG_POOL_MAX
              value: {{ .Values.gateway.poolMax | quote }}

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.gateway.jwtSecretName" . }}
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.gateway.encryptionSecretName" . }}
                  key: encryption-key

            # Comma separated, parsed and validated at startup so a malformed list is a
            # refusal to boot rather than a surprise when the SSRF guard first runs.
            - name: UPSTREAM_ALLOWLIST
              value: {{ join "," .Values.gateway.upstreamAllowlist | quote }}
            - name: UPSTREAM_PRIVATE_HOSTS
              value: {{ join "," .Values.gateway.upstreamPrivateHosts | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.gateway.cookieSecure | quote }}
            - name: UPSTREAM_PROBE_INTERVAL_MS
              value: {{ mul .Values.gateway.upstreamProbeIntervalSeconds 1000 | quote }}
            # Much shorter than upstreamTimeoutSeconds: a probe asks whether an upstream is
            # alive, not whether it can finish a unit of work. See mcp/prober.ts.
            - name: UPSTREAM_PROBE_TIMEOUT_MS
              value: {{ .Values.gateway.upstreamProbeTimeoutMs | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}

            {{/*
            The chat agent.

            The key is the only env var here that is conditional, and the condition is the
            point: with no key the variable is absent, the gateway's config schema accepts
            that because GROQ_API_KEY is optional, and POST /api/chat answers 503 with a
            sentence saying the deployment has no model key. The alternative - always
            setting it, from a Secret that may not exist - makes the pod fail to start with
            a CreateContainerConfigError, which takes the whole platform down because one
            optional feature was not configured.
            */}}
            {{- if include "platform.gateway.chatEnabled" . }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.gateway.groqSecretName" . }}
                  key: groq-api-key
            {{- end }}
            - name: GROQ_MODEL
              value: {{ .Values.chat.model | quote }}
            - name: CHAT_MAX_ITERATIONS
              value: {{ .Values.chat.maxIterations | quote }}
            - name: CHAT_MODEL_TIMEOUT_MS
              value: {{ mul .Values.chat.modelTimeoutSeconds 1000 | quote }}
            {{/*
            How often the sweeper tidies expired chat keys (8.4).

            Note what this is NOT: the enforcement interval. An expired key is rejected by
            resolveApiKey on every call, so this only decides how quickly the keys table
            stops listing a dead key as outstanding. A crashed sweeper costs tidiness, not
            security - which is the whole reason the check lives on the request path.

            The TTL itself is deliberately not set here. config.ts derives it from
            CHAT_MAX_ITERATIONS and CHAT_MODEL_TIMEOUT_MS, because it has to outlast the
            longest legitimate turn and a hand-set number would drift the moment somebody
            raised the iteration cap.
            */}}
            - name: CHAT_KEY_SWEEP_INTERVAL_MS
              value: {{ mul .Values.chat.keySweepIntervalSeconds 1000 | quote }}
            {{/*
            The agent reaches the gateway's own /mcp over loopback, so this follows PORT
            rather than the Service name. See the note at the top of chat/agent.ts: routing
            through the Service could land the call on the other replica and make one chat
            depend on two pods being healthy.
            */}}
            {{/*
            Built from the SAME expression as PORT above, deliberately.

            The first version of this line used `.Values.gateway.port`, which does not
            exist - the port lives in `gateway.ports[0].containerPort` - so it rendered
            `http://127.0.0.1:/mcp` and the gateway refused to start with
            "CHAT_SELF_MCP_URL: Invalid URL". The config schema's fail-fast caught it in
            about four seconds, which is the behaviour 4.2 was built for and the first time
            it has caught something real.

            Reusing the identical expression rather than repeating the number is what stops
            the two from drifting: if the container port changes, the agent follows it, and
            a mismatch here would mean the gateway could not call itself while every other
            thing about it looked healthy.
            */}}
            - name: CHAT_SELF_MCP_URL
              value: {{ printf "http://127.0.0.1:%v/mcp" (first .Values.gateway.ports).containerPort | quote }}
          volumeMounts:
            # The root filesystem is read-only, so anything needing a scratch path gets a
            # named volume. Node writes nothing itself; this exists for the OS temp
            # directory that libraries assume is available.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
