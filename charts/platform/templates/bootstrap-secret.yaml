{{- if and .Values.seed.enabled (not .Values.secrets.bootstrapExistingSecret) }}
{{/*
The seeded admin and member passwords.

Generated in the cluster and never typed by anyone, which is the point: there is no
default password in this repository, no placeholder in a values file, and nothing to
forget to change. The operator reads the value out of the Secret once to log in, and can
then change it through the dashboard.

`resource-policy: keep` so the credentials survive `helm uninstall`. The Postgres PVC
survives it too, and the user rows with it - a regenerated password would then disagree
with the hash already stored, and the seed Job will not overwrite an existing account, so
nobody could log in to a release that still had all its data.

32 characters, well above the 12 the seed script enforces as a floor. The floor exists for
`bootstrapExistingSecret`, where a human chooses the value.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.bootstrapSecretName" . }}
  labels:
    {{- include "common.componentLabels" (dict "root" $ "component" "seed") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-email: {{ .Values.seed.adminEmail | quote }}
  member-email: {{ .Values.seed.memberEmail | quote }}
data:
  admin-password: {{ include "common.secretValue" (dict "root" $ "name" (include "platform.bootstrapSecretName" .) "key" "admin-password" "length" 32) }}
  member-password: {{ include "common.secretValue" (dict "root" $ "name" (include "platform.bootstrapSecretName" .) "key" "member-password" "length" 32) }}
{{- end }}
