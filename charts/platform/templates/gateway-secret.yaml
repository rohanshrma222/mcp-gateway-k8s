{{/*
The gateway's own two secrets.

Both use the generate-but-stable `lookup` pattern, and for the encryption key that is not
a convenience - it is the difference between working and silent data loss. A plain
`randAlphaNum` would be re-evaluated on every `helm upgrade`, and a new encryption key
means every upstream credential already in the database decrypts to nothing. The failure
would appear later, on the first tool call against an upstream that needs authentication,
with no obvious connection to the upgrade that caused it.

`helm.sh/resource-policy: keep` for the same reason as the database Secrets: the Postgres
PVC survives `helm uninstall`, so the rows encrypted under this key survive too, and a key
that did not survive with them would leave undecryptable data behind.

Two objects rather than one with two keys, because the lifecycles differ. Rotating the JWT
signing key logs everyone out, which is a minor inconvenience and sometimes exactly what
you want. Rotating the encryption key destroys stored credentials. Those should not share
a blast radius or a rotation command.
*/}}
{{- if not .Values.secrets.jwtExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.gateway.jwtSecretName" . }}
  labels:
    {{- include "common.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # 48 characters, comfortably above the 32 the gateway's config schema requires. The
  # schema validates a floor rather than an exact length so that an externally managed
  # Secret can be longer without the gateway refusing to start.
  jwt-secret: {{ include "common.secretValue" (dict "root" $ "name" (include "platform.gateway.jwtSecretName" .) "key" "jwt-secret" "length" 48) }}
{{- end }}
{{- if not .Values.secrets.encryptionExistingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.gateway.encryptionSecretName" . }}
  labels:
    {{- include "common.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Must be exactly 64 lowercase hex characters - 32 bytes for AES-256-GCM - which is why
  # this uses common.secretHexValue rather than common.secretValue. A generated value that
  # failed the gateway's own validation would be a chart that installs cleanly and a pod
  # that never starts.
  encryption-key: {{ include "common.secretHexValue" (dict "root" $ "name" (include "platform.gateway.encryptionSecretName" .) "key" "encryption-key") }}
{{- end }}
