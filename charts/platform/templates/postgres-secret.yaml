{{- if not .Values.postgres.auth.existingSecret }}
{{/*
Generated Postgres credentials, same pattern and same reasoning as the store's MariaDB
Secret.

`common.secretValue` looks for the Secret already in this namespace and reuses it,
generating only on first install. Plain `randAlphaNum` re-randomises on every
`helm upgrade`, which for a database on a PVC is slow data loss: the volume still holds a
cluster whose role has the old password, the new Secret disagrees, and the pod never
becomes ready again.

`helm.sh/resource-policy: keep` because a StatefulSet's volumeClaimTemplates PVCs survive
`helm uninstall` - the retention default is Retain - so the data outlives the release. The
password that opens it has to outlive the release too, or a reinstall onto the surviving
volume locks itself out of its own data.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.postgres.secretName" . }}
  labels:
    {{- include "common.componentLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ include "common.secretValue" (dict "root" $ "name" (include "platform.postgres.secretName" .) "key" "postgres-password" "length" 32) }}
{{- end }}
