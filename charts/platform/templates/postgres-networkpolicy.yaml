{{- if .Values.networkPolicy.enabled }}
{{- $ctx := dict "root" $ "component" "postgres" }}
{{/*
Postgres accepts connections from the gateway and the migration Job, and from nothing
else.

Note what makes this work without a namespace-wide default-deny: a NetworkPolicy that
selects a pod makes that pod default-deny for the directions it names. So this single
object isolates Postgres completely and then re-admits two specific callers - there is no
window in which the database is reachable by everything.

That is the lesson from stage 3 applied in the other direction. There, a namespace-wide
`podSelector: {}` deny cut WordPress off from its own database because the deny applies to
every pod and only one allow rule had been written. Here the policy is scoped to the one
workload that needs protecting, so adding it cannot break anything else in the namespace.
The namespace-wide default-deny for this namespace arrives in the stage 9 security sweep,
once every legitimate path in it is known and can be enumerated in one place.

Both callers are selected by LABEL, never by address. Pod IPs change on every reschedule,
so an address-based rule is either wrong after the first restart or wide enough to permit
the whole subnet. A label follows the workload.

No egress rule here, on purpose. The moment a pod is selected by any egress policy it is
isolated for egress, which would cut DNS for Postgres; and Postgres initiates nothing
outbound anyway, so an egress policy would add a way to break it in exchange for nothing.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.postgres.name" . }}-allow
  labels:
    {{- include "common.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The gateway, and the migration Job. Two separate list entries, which is correct
        # and deliberate: these are alternative sources, so OR is what is wanted. Inside a
        # single `from` entry the selectors would be ANDed and match nothing, since no pod
        # is both the gateway and the migration Job.
        #
        # Contrast the woo-mcp rule in charts/store, where namespaceSelector and
        # podSelector ARE combined in one entry on purpose, because there the requirement
        # is "a gateway pod IN that namespace". Same syntax, opposite meaning - which is
        # why each one says which it is.
        - podSelector:
            matchLabels:
              {{- include "common.selectorLabels" (dict "root" $ "component" "gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "common.selectorLabels" (dict "root" $ "component" "migrations") | nindent 14 }}
      ports:
        {{- range .Values.postgres.ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .name }}
        {{- end }}
{{- end }}
