{{- if not .Values.mariadb.auth.existingSecret }}
{{/*
Generated MariaDB credentials.

Two things here are load-bearing.

1. The values come from `common.secretValue`, which looks for the Secret that already
   exists in this namespace and reuses it, generating only on first install. The naive
   `randAlphaNum` alone re-randomises on every `helm upgrade`, which for a database is
   slow data loss: the PVC still holds a database whose user has the old password, the
   new Secret disagrees, and the pod never becomes ready again.

2. `helm.sh/resource-policy: keep`. A StatefulSet's volumeClaimTemplates PVCs are NOT
   deleted by `helm uninstall` - the default retention policy is Retain - so the data
   outlives the release. The password that opens it has to outlive the release too, or a
   reinstall onto the surviving volume locks itself out. Keeping the Secret is the only
   choice consistent with keeping the data.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.mariadb.secretName" . }}
  labels:
    {{- include "common.componentLabels" (dict "root" $ "component" "mariadb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "common.secretValue" (dict "root" $ "name" (include "store.mariadb.secretName" .) "key" "mariadb-root-password" "length" 32) }}
  mariadb-password: {{ include "common.secretValue" (dict "root" $ "name" (include "store.mariadb.secretName" .) "key" "mariadb-password" "length" 32) }}
{{- end }}
