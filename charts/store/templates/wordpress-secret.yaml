{{- if not .Values.wordpress.auth.existingSecret }}
{{/*
WordPress credentials and salts.

The eight salts are the interesting part. WordPress uses them to sign auth cookies and
nonces, and the official image generates fresh random ones into wp-config.php whenever
that file is absent. Since only wp-content is persisted - core comes from the image, by
design, so an image bump actually upgrades WordPress - wp-config.php is regenerated on
every pod start. Left alone, that means every pod restart silently logs out every user and
invalidates every form nonce in flight.

So the salts are generated once into this Secret and injected as environment variables,
which keeps wp-content-only persistence *and* stable sessions. The alternative is
persisting all of /var/www/html, which trades this problem for a worse one: WordPress core
frozen at whatever version first wrote the volume.

resource-policy: keep for the same reason as the MariaDB Secret - the data outlives the
release, so the credentials that open it must too.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.wordpress.secretName" . }}
  labels:
    {{- include "common.componentLabels" (dict "root" $ "component" "wordpress") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $name := include "store.wordpress.secretName" . }}
  wordpress-admin-password: {{ include "common.secretValue" (dict "root" $ "name" $name "key" "wordpress-admin-password" "length" 24) }}
  {{/*
    The WooCommerce REST credential, in plaintext, deliberately.

    WordPress stores an application password only as a hash, so it cannot be read back
    after creation. If the bootstrap Job generated one, the only way woo-mcp could learn it
    would be for the Job to write it back into a Kubernetes Secret - which needs a
    ServiceAccount with create/update on secrets, i.e. a real privilege granted to a
    short-lived batch pod.

    Inverting it removes that entirely: this Secret is the source of truth, the Job hashes
    this value into WordPress, and woo-mcp reads the same value from a mounted file. No
    write-back, no RBAC, and rotating the credential is editing one Secret.
  */}}
  wordpress-app-password: {{ include "common.secretValue" (dict "root" $ "name" $name "key" "wordpress-app-password" "length" 32) }}
  {{- range $key := list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ $key }}: {{ include "common.secretValue" (dict "root" $ "name" $name "key" $key "length" 64) }}
  {{- end }}
{{- end }}
