# charts/store - defaults shared by every environment.
#
# Rule for this file and its siblings: values.yaml holds everything that is true
# everywhere, and values-local.yaml / values-prod.yaml hold only what genuinely differs
# between a laptop and a k3s VPS. If a key appears in both overlays with different
# values, it belongs here with one of them as the default. That discipline is what makes
# `helm template -f values-prod.yaml` diff against local as *config only*, which is the
# property the brief asks to be demonstrated.

nameOverride: ''
fullnameOverride: ''

global:
  # Empty locally: images are built and `kind load docker-image`d, so there is no
  # registry in the reference. values-prod.yaml sets this to GHCR.
  imageRegistry: ''
  imagePullPolicy: IfNotPresent
  # Empty means "use the cluster default StorageClass". kind provides `standard`,
  # k3s provides `local-path`; naming it per environment keeps this chart portable.
  storageClass: ''

store:
  # Identifies this store. Every object name and the MCP server slug derive from it, so
  # installing a second store is `--set store.slug=acme` in its own namespace.
  slug: default
  host: store.urumi.local

# --------------------------------------------------------------------- mariadb

mariadb:
  image:
    repository: mariadb
    tag: '11.8.4'
  # Credentials are never literals here. The chart generates them on first install with
  # `lookup` + `randAlphaNum` and reuses the existing Secret afterwards, so a
  # `helm upgrade` cannot rotate the password out from under a PVC that still holds data
  # encrypted-at-rest under the old one. Set existingSecret to bring your own.
  auth:
    database: wordpress
    username: wordpress
    existingSecret: ''
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ''
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  probes:
    # The official MariaDB image ships /usr/local/bin/healthcheck.sh, and it is a better
    # answer than the usual `mariadb-admin ping` for two reasons.
    #
    # --innodb_initialized is the one that matters: a plain ping answers as soon as the
    # server is listening, which is true while InnoDB is still replaying its redo log and
    # the database is not yet usable. Readiness that goes green too early hands traffic
    # to a server that will reject it.
    #
    # And it needs no password on the command line. `mariadb-admin ping -p"$PASS"` puts
    # the root password in the process list on every probe interval. Here
    # MARIADB_MYSQL_LOCALHOST_USER=1 creates a mysql@localhost user with USAGE only, and
    # healthcheck.sh connects over the unix socket as that user - no credential, and no
    # privilege to misuse if one leaked.
    readiness:
      exec:
        command: ['healthcheck.sh', '--connect', '--innodb_initialized']
      periodSeconds: 10
      timeoutSeconds: 5
    # Liveness is deliberately weaker than readiness: --connect only. Liveness failure
    # restarts the container, so it must answer "is this process wedged?" and nothing
    # more. If liveness also required InnoDB to be initialised, a long crash recovery
    # would be interrupted by a restart, which starts the recovery over - a loop that
    # looks like a corrupt database and is actually a probe bug.
    liveness:
      exec:
        command: ['healthcheck.sh', '--connect']
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    # First boot initialises the data directory, which is far slower than steady state.
    # Without a startup probe the liveness timeout would have to be long enough to cover
    # first run, and would then be useless for detecting a wedged server later. 60 x 5s
    # gives first-run initialisation five minutes before anything is restarted.
    startup:
      exec:
        command: ['healthcheck.sh', '--connect', '--innodb_initialized']
      periodSeconds: 5
      failureThreshold: 60
  ports:
    - name: mysql
      containerPort: 3306
  securityContext:
    # The entrypoint takes ownership of the data directory on first run, so the root
    # filesystem cannot be read-only here. Stated in values rather than hidden in a
    # template, so the exception is visible to whoever reviews this.
    readOnlyRootFilesystem: false
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

# ------------------------------------------------------------------- wordpress

wordpress:
  image:
    repository: wordpress
    # WordPress 7.1.3. Pinned to 7.x because current WooCommerce requires WordPress >= 7.0
    # and refuses to install on 6.9 - found by the bootstrap hook failing with
    # "Minimum WordPress requirement is 7.0". The version floor here is set by the
    # plugin, not by a general preference for trailing one minor behind latest.
    tag: '7.1.3-php8.4-apache'
  replicas: 1
  # local | production. Set to `local` by values-local.yaml, and that is load-bearing:
  # WordPress only offers Application Passwords over plain HTTP when
  # wp_get_environment_type() is `local`, and the WooCommerce MCP server authenticates
  # to the REST API with one. In production this becomes `production` and the connection
  # is TLS end to end.
  environmentType: production
  persistence:
    # wp-content only: plugins, themes and uploads. WordPress core comes from the image,
    # so it is replaced on upgrade rather than persisted and left stale.
    enabled: true
    size: 4Gi
    storageClass: ''
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 768Mi }
  probes:
    # Readiness on a page that requires PHP *and* the database. Liveness on a static
    # path served by Apache alone - pointing liveness at the database would turn a
    # MariaDB blip into a WordPress restart loop, which is strictly worse than serving
    # an error page.
    readiness:
      httpGet: { path: /wp-login.php, port: http }
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      httpGet: { path: /, port: http }
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 6
    startup:
      httpGet: { path: /, port: http }
      periodSeconds: 5
      failureThreshold: 60
  securityContext:
    # Apache writes to /var/run and php-fpm to its session and opcache directories, both
    # outside the wp-content PVC.
    readOnlyRootFilesystem: false
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
  ports:
    - name: http
      containerPort: 80
  # Site identity. The admin password and the eight WordPress salts are generated into a
  # Secret with the lookup pattern; set existingSecret to supply your own.
  auth:
    adminUser: admin
    adminEmail: admin@urumi.local
    existingSecret: ''
  title: Urumi Demo Store
  # Normally derived from image.tag; set only if the tag is not <version>-<variant>.
  coreVersion: ''
  tablePrefix: wp_
  # The label this credential appears under in wp-admin > Users > Application Passwords.
  # woo-mcp authenticates to the WooCommerce REST API with it.
  appPasswordName: woo-mcp

# ------------------------------------------------------------------- bootstrap

bootstrap:
  # Helm post-install/post-upgrade hook that turns an empty WordPress into a working
  # WooCommerce store. Idempotent: guarded by `wp core is-installed`, so a re-run changes
  # nothing except re-asserting the application password from the Secret.
  enabled: true
  image:
    repository: wordpress
    tag: 'cli-2.12-php8.3'
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }
  securityContext:
    # wp-cli downloads core into an emptyDir and writes wp-config.php there.
    readOnlyRootFilesystem: false
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33
  # Two sample products so the storefront is not empty on first load and the checkout
  # demo has something to buy.
  products:
    - name: Urumi Demo Mug
      price: '499'
      description: A plain ceramic mug. Exists so the storefront has something to sell.
    - name: Urumi Demo Notebook
      price: '249'
      description: A plain A5 notebook. The second product, so the cart has a choice.
  # Backoff limit of 3: a transient database or network failure deserves a retry, but an
  # endlessly retrying hook would block `helm upgrade` until its timeout.
  backoffLimit: 3


# --------------------------------------------------------------------- woo-mcp

wooMcp:
  image:
    repository: urumi/woo-mcp
    tag: dev
  replicas: 1
  # No ingress key at all, and that is the point: the WooCommerce MCP server has no
  # external route to disable, so "unreachable from outside the cluster" is a property of
  # what does not exist rather than a rule someone has to maintain.
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  probes:
    # timeoutSeconds is set EXPLICITLY on both, and the reason is a bug this caused.
    #
    # The kubelet's default is 1 second, which is nowhere in the manifest and therefore
    # invisible. /readyz reports store reachability as a diagnostic, and the first version
    # of that probe was unbounded - so during a brief store outage the handler took far
    # longer than a second, readiness failed on `context deadline exceeded`, and the pod
    # left its Service exactly when the readiness design exists to keep it in.
    #
    # 3 seconds here, against a 1500ms in-process ceiling and a 1000ms store-probe
    # budget. Both margins are deliberate: a health endpoint that touches the network at
    # all needs more than the default, and the handler must answer well before the
    # kubelet stops waiting.
    readiness:
      httpGet: { path: /readyz, port: http }
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 30
      failureThreshold: 6
      # /healthz touches nothing, so 2s is pure headroom against a busy event loop
      # rather than against any dependency.
      timeoutSeconds: 2
  securityContext:
    # A Node process serving HTTP has no reason to write to its own filesystem, so it
    # keeps every default: non-root, read-only root, all capabilities dropped.
    runAsUser: 1000
    runAsGroup: 1000
    # Required for the mounted credential to be readable. A projected Secret file is
    # owned by root, and fsGroup is what sets its GROUP - without this, mode 0440 means
    # root-only and the process fails with EACCES on its own credential.
    fsGroup: 1000
  ports:
    - name: http
      containerPort: 3000
  # Budget for a WooCommerce tool call. Generous, because a WordPress install under load
  # genuinely is slow and a failed tool call is worse than a slow one.
  timeoutSeconds: 20
  # Budget for the diagnostic store probe inside /readyz. Two orders of magnitude smaller
  # than a tool call, because it must answer inside the readiness probe's own timeout -
  # see the comment on probes above.
  probeTimeoutMs: 1000
  logLevel: info

# --------------------------------------------------------------------- ingress

ingress:
  enabled: true
  # Same class locally and in production, because k3s ships Traefik by default. The
  # charts emit plain Ingress objects, so nothing here is Traefik-specific.
  className: traefik
  annotations: {}
  tls:
    enabled: false
    secretName: ''
    # cert-manager issuer; prod only.
    clusterIssuer: ''

# ---------------------------------------------------------------- networkpolicy

networkPolicy:
  # Default-deny in this namespace plus the specific allows. Enforcement was verified by
  # scripts/verify-netpol.ps1 before any of this was written.
  enabled: true
  # Pods matching these labels may reach woo-mcp. Written as a selector rather than a
  # CIDR so that rescheduling the gateway onto another node cannot break the rule.
  gatewayPodLabels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: gateway
  gatewayNamespace: urumi-platform
