{{- if and .Values.networkPolicy.enabled .Values.everythingMcp.enabled }}
{{- $ctx := dict "root" $ "component" "everything-mcp" }}
{{/*
Step 6.4 - the same isolation notes-mcp gets, applied to a server we did not write.

That is the point worth making: these two policies are identical in shape, and nothing here
depends on trusting the workload. The default-deny object lives in
notes-mcp-networkpolicy.yaml and already covers every pod in this namespace, including this
one, so only the two component-specific policies are here.

Egress is DNS-only, exactly as for notes-mcp. For a third-party server that is doing more
work than it looks: this is the pod most likely to be the one you did not fully read, and it
cannot open a connection to the internet, to the store, to Postgres or to the Kubernetes
API. Its get-env tool is a deliberate invitation to look for credentials; even if it found
one it has nowhere to send it.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "upstreams.everythingMcp.name" . }}-allow-gateway
  labels:
    {{- include "common.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # namespaceSelector AND podSelector inside ONE from entry: the traffic must come
        # from a pod carrying the gateway's labels AND in the platform namespace. Two
        # separate list entries would be an OR, which is much weaker than it looks.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabels | nindent 14 }}
      ports:
        {{- range .Values.everythingMcp.ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .name }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "upstreams.everythingMcp.name" . }}-egress
  labels:
    {{- include "common.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS only. Declaring Egress at all makes everything not listed here denied, so this is
    # the complete list of destinations this pod may reach.
    #
    # Both protocols: a reply over 512 bytes sets the truncated bit and the resolver retries
    # over TCP. A UDP-only rule works until it does not, and the symptom is an intermittent
    # resolution failure under load.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
