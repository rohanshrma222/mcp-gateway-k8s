# charts/upstreams - the MCP servers that are not the store.
#
# Two of them, chosen to make the hard cases demonstrable rather than theoretical:
# one we wrote that collides on purpose, and one we did not write at all.

nameOverride: ''
fullnameOverride: ''

global:
  imageRegistry: ''
  imagePullPolicy: IfNotPresent
  storageClass: ''

# ------------------------------------------------------------------- notes-mcp

notesMcp:
  enabled: true
  image:
    repository: urumi/notes-mcp
    tag: dev
  # 1, and it cannot usefully be more: SQLite on a ReadWriteOnce volume means one writer
  # on one node. A second replica either fails to schedule or, on a ReadWriteMany backend,
  # corrupts the database. A real constraint rather than an oversight - and a useful one
  # for the demo, since it puts an upstream that genuinely cannot scale behind a gateway
  # that can.
  replicas: 1
  slug: team
  logLevel: info
  # Exposes add_note, list_notes - and list_products, which collides with the
  # WooCommerce server's tool of the same name on purpose. A collision that exists only
  # in a design document is not a demonstration; this one makes the
  # <serverSlug>__<toolName> scheme something that can be shown working.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }
  probes:
    readiness:
      httpGet: { path: /readyz, port: http }
      periodSeconds: 10
    liveness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 30
      failureThreshold: 6
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    # fsGroup declares which group should own the mounted volume, so a non-root process can
    # write to it. Declared here for portability - and the honest version of what it does
    # on this cluster is worth writing down, because it is less than it looks.
    #
    # Measured rather than assumed. With fsGroup: 1000 set, `stat /data` inside the pod
    # still reports root:root mode 0777. The PV is hostPath-backed (the local-path
    # provisioner, which is also k3s's default), and the kubelet does not apply fsGroup
    # ownership to a hostPath volume. So on both the kind cluster AND the k3s VPS target,
    # this pod can write only because the provisioner happens to create the directory
    # world-writable.
    #
    # It is still correct to declare it, for the case this project is explicitly asked to
    # support: swapping the storage backend in values-prod.yaml. A CSI driver - a cloud
    # disk, Longhorn - does honour fsGroup, and without this line the pod would get a
    # root-owned 0755 directory it cannot write, crash-looping with an error about SQLite
    # rather than about permissions. Postgres sets fsGroup: 70 for the same reason; this
    # was the inconsistency.
    #
    # What this is NOT is a fix for the 0777 reliance on local-path. That is a property of
    # the provisioner, not something a pod spec can assert, and claiming otherwise would be
    # a sentence in a values file that a reviewer could disprove with one `stat`.
    fsGroup: 1000
    # Writes a SQLite file to its PVC, and nowhere else.
    readOnlyRootFilesystem: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ''
  ports:
    - name: http
      containerPort: 3000

# -------------------------------------------------------------- everything-mcp

everythingMcp:
  enabled: true
  image:
    # A pinned Dockerfile around @modelcontextprotocol/server-everything rather than a
    # third-party image: there is no official, trustworthy `mcp/everything` image, and
    # building our own keeps the supply chain ours while still giving us a server we did
    # not write.
    repository: urumi/everything-mcp
    tag: dev
  replicas: 1
  # Earns its place by being awkward: longRunningOperation is a real timeout demo, and
  # printEnv is a real credential-leak test - it proves the gateway never forwards a
  # client's token or its own environment to an upstream.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }
  probes:
    readiness:
      httpGet: { path: /readyz, port: http }
      periodSeconds: 10
    liveness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 30
      failureThreshold: 6
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  ports:
    - name: http
      containerPort: 3000

# ---------------------------------------------------------------- networkpolicy

networkPolicy:
  enabled: true
  # Neither server has an Ingress, and both accept traffic only from the gateway's pods.
  # The selector is by label, not by address, so rescheduling cannot quietly open or
  # close the path.
  gatewayPodLabels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: gateway
  gatewayNamespace: urumi-platform
