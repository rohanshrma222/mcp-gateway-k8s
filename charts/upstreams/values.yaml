# charts/upstreams - the MCP servers that are not the store.
#
# Two of them, chosen to make the hard cases demonstrable rather than theoretical:
# one we wrote that collides on purpose, and one we did not write at all.

nameOverride: ''
fullnameOverride: ''

global:
  imageRegistry: ''
  imagePullPolicy: IfNotPresent
  storageClass: ''

# ------------------------------------------------------------------- notes-mcp

notesMcp:
  enabled: true
  image:
    repository: urumi/notes-mcp
    tag: dev
  # 1, and it cannot usefully be more: SQLite on a ReadWriteOnce volume means one writer
  # on one node. A second replica either fails to schedule or, on a ReadWriteMany backend,
  # corrupts the database. A real constraint rather than an oversight - and a useful one
  # for the demo, since it puts an upstream that genuinely cannot scale behind a gateway
  # that can.
  replicas: 1
  slug: team
  logLevel: info
  # Exposes add_note, list_notes - and list_products, which collides with the
  # WooCommerce server's tool of the same name on purpose. A collision that exists only
  # in a design document is not a demonstration; this one makes the
  # <serverSlug>__<toolName> scheme something that can be shown working.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }
  probes:
    readiness:
      httpGet: { path: /readyz, port: http }
      periodSeconds: 10
    liveness:
      httpGet: { path: /healthz, port: http }
      periodSeconds: 30
      failureThreshold: 6
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    # fsGroup declares which group should own the mounted volume, so a non-root process can
    # write to it. Declared here for portability - and the honest version of what it does
    # on this cluster is worth writing down, because it is less than it looks.
    #
    # Measured rather than assumed. With fsGroup: 1000 set, `stat /data` inside the pod
    # still reports root:root mode 0777. The PV is hostPath-backed (the local-path
    # provisioner, which is also k3s's default), and the kubelet does not apply fsGroup
    # ownership to a hostPath volume. So on both the kind cluster AND the k3s VPS target,
    # this pod can write only because the provisioner happens to create the directory
    # world-writable.
    #
    # It is still correct to declare it, for the case this project is explicitly asked to
    # support: swapping the storage backend in values-prod.yaml. A CSI driver - a cloud
    # disk, Longhorn - does honour fsGroup, and without this line the pod would get a
    # root-owned 0755 directory it cannot write, crash-looping with an error about SQLite
    # rather than about permissions. Postgres sets fsGroup: 70 for the same reason; this
    # was the inconsistency.
    #
    # What this is NOT is a fix for the 0777 reliance on local-path. That is a property of
    # the provisioner, not something a pod spec can assert, and claiming otherwise would be
    # a sentence in a values file that a reviewer could disprove with one `stat`.
    fsGroup: 1000
    # Writes a SQLite file to its PVC, and nowhere else.
    readOnlyRootFilesystem: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ''
  ports:
    - name: http
      containerPort: 3000

# -------------------------------------------------------------- everything-mcp

everythingMcp:
  enabled: true
  image:
    # A pinned Dockerfile around @modelcontextprotocol/server-everything rather than a
    # third-party image: there is no official, trustworthy `mcp/everything` image, and
    # building our own keeps the supply chain ours while still giving us a server we did
    # not write.
    repository: urumi/everything-mcp
    tag: dev
  # 1, and unlike notes-mcp the reason is not storage - it is that this server runs in
  # SESSION mode. It generates an mcp-session-id on initialize and keeps the session in
  # that process's memory, so a second replica would answer a client whose session it
  # has never heard of. Scaling it would need sticky sessions at the ingress or a shared
  # session store: infrastructure bought to solve a problem the server's own design
  # created.
  #
  # This is the concrete argument for why OUR two servers are stateless, and it is worth
  # having a live example of the alternative rather than only an opinion about it.
  replicas: 1
  # Earns its place by being awkward. The two tools that matter:
  #
  #   trigger-long-running-operation  takes a duration in seconds, so it can be made to
  #                                   outlast this upstream timeout on purpose - the one
  #                                   way to exercise the upstream_timeout audit outcome
  #                                   that 6.1 could not reach against a fast store.
  #   get-env                         returns its whole environment to any caller, which
  #                                   is a real credential-leak test rather than a
  #                                   thought experiment: it proves the gateway forwards
  #                                   neither a client's API key nor its own secrets.
  #
  # Those are the names version 1.0.0 actually registers. The plan was written against
  # an older release that called them longRunningOperation and printEnv; the package was
  # restructured and both were renamed. Checked against the published tarball rather
  # than assumed, because a demo built on a guessed tool name fails live.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }
  probes:
    # tcpSocket, not httpGet, because this server has NO health endpoint - verified by
    # grepping the published package, which serves only /mcp.
    #
    # The obvious alternative is probing /mcp, and it is worse. A GET without a session
    # id answers 400, which an httpGet probe counts as a failure, so the pod would never
    # become ready. A POST probe would have the kubelet open an MCP session every ten
    # seconds and never close it, leaking a session per probe into that process memory.
    #
    # So this is a weaker check than the other two upstreams get, and that is the real
    # trade: it proves the port is bound, not that the protocol works. The gateway own
    # 15-second prober is what establishes whether this upstream answers tools/list -
    # the layer that genuinely knows - and it reports that in the dashboard rather than
    # silently restarting the pod.
    readiness:
      tcpSocket: { port: http }
      periodSeconds: 10
    liveness:
      tcpSocket: { port: http }
      periodSeconds: 30
      failureThreshold: 6
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
  ports:
    - name: http
      containerPort: 3000

# ---------------------------------------------------------------- networkpolicy

networkPolicy:
  enabled: true
  # Neither server has an Ingress, and both accept traffic only from the gateway's pods.
  # The selector is by label, not by address, so rescheduling cannot quietly open or
  # close the path.
  gatewayPodLabels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: gateway
  gatewayNamespace: urumi-platform
